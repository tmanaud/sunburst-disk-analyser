name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Actions are pinned to full commit hashes; the comment names the tag.
# Builds only read the repository; the release job alone may write to it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # GitHub keeps the two latest macOS images; macos-14 is retired on 2026-11-02.
    runs-on: macos-15
    env:
      # Developer ID signing and notarisation, for tags and manual runs, once
      # these secrets exist: MACOS_CERTIFICATE_P12 (base64 of the .p12),
      # MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, NOTARY_KEY_P8 (the
      # App Store Connect API key), NOTARY_KEY_ID and NOTARY_ISSUER.
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A release tag must name the version the binaries carry.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Test
        run: cargo test
      - name: Signing keychain
        if: env.SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ env.SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          NOTARY_KEY_P8: ${{ env.SIGNING == 'true' && secrets.NOTARY_KEY_P8 || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./packaging/build-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test
      - name: Package
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
      # Removal reaches the Recycle Bin, or leaves the item in place. Temp
      # files live on C:, whose bin the next steps shrink, then turn off.
      - name: Removal goes to the Recycle Bin
        timeout-minutes: 10
        run: cargo test -- --ignored --exact ops::tests::remove_goes_to_trash ops::tests::removed_item_is_in_recycle_bin
      - name: Removal refused when the Recycle Bin is too small
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $volume = (Get-CimInstance Win32_Volume -Filter "DriveLetter='C:'").DeviceID
          $guid = [regex]::Match($volume, '\{[^}]+\}').Value
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\BitBucket\Volume\$guid"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name MaxCapacity -Value 1 -Type DWord
          $env:REFUSED_SIZE = 4194304
          cargo test -- --ignored --exact ops::tests::remove_refused_when_recycle_bin_cannot_take_it
      - name: Removal refused when the Recycle Bin is off
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v NoRecycleFiles /t REG_DWORD /d 1 /f
          $env:REFUSED_SIZE = 16
          cargo test -- --ignored --exact ops::tests::remove_refused_when_recycle_bin_cannot_take_it

  # RustSec advisories for the crates built into the binaries (deny.toml).
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  linux:
    # Oldest hosted image, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-xkb1 file
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test
      - name: Package
        run: ./packaging/build-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, advisories]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # First: checkout cleans the folder, the downloaded files with it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { if (on) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { on = 1; next } } on' \
            CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: true
