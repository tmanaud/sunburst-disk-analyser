[package]
name = "sunburst-disk-analyser"
version = "1.0.0"
edition = "2021"
description = "Cross-platform disk space analyser with an interactive sunburst chart"
license = "MIT"
repository = "https://github.com/tmanaud/sunburst-disk-analyser"
build = "build.rs"

[[bin]]
name = "sunburst-disk-analyser"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
egui = "=0.31.1"
parking_lot = "0.12"
rfd = "0.15"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
dirs = "6"
sys-locale = "0.3"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

# Linux trashes with its own rename-only code (see ops.rs).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
